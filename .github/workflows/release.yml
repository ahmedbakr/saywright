name: Release

# When a version tag (v0.1.0) is pushed: publishes @saywright/vite and saywright to npm, then creates the GitHub
# release with that version's notes from CHANGELOG.md. Needs the repository secret NPM_TOKEN: an npm token allowed to
# publish both packages. Run again after a failure, it skips what is already done.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # the GitHub release
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: The tag matches both packages' version
        run: node -e "const v=process.env.GITHUB_REF_NAME.slice(1);for(const f of ['packages/vite/package.json','apps/studio/package.json']){const p=require('./'+f);if(p.version!==v){console.error(f+' is '+p.version+', the tag is '+v);process.exit(1)}}"
      - name: Publish @saywright/vite
        run: |
          v="${GITHUB_REF_NAME#v}"
          if [ "$(npm view "@saywright/vite@$v" version 2>/dev/null)" = "$v" ]; then echo "Already on npm."; else npm publish -w packages/vite --provenance --access public; fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish saywright
        run: |
          v="${GITHUB_REF_NAME#v}"
          if [ "$(npm view "saywright@$v" version 2>/dev/null)" = "$v" ]; then echo "Already on npm."; else npm publish -w apps/studio --provenance --access public; fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: The GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then echo "Already released."; exit 0; fi
          node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Saywright ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
