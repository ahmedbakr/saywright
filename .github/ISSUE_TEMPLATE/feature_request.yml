name: Idea
description: Something Saywright could do, or do better
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The situation and what gets in your way, more than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
