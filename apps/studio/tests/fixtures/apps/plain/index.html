<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
    <title>Lantern Notes</title>
    <style>
      body { font: 16px system-ui, sans-serif; margin: 0; color: #1d1d1f; background: #faf8f4; }
      header { padding: 20px 32px; border-bottom: 1px solid #e6e0d6; }
      main { padding: 32px; max-width: 640px; }
      button { font: inherit; padding: 10px 18px; border-radius: 8px; border: 1px solid #1d1d1f; background: #1d1d1f; color: white; cursor: pointer; }
      .note { padding: 12px 16px; background: white; border: 1px solid #e6e0d6; border-radius: 10px; margin: 12px 0; }
    </style>
  </head>
  <body>
    <header><strong>Lantern Notes</strong></header>
    <main>
      <h1>Your notes</h1>
      <p class="note" data-testid="note">Buy oat milk</p>
      <button type="button" data-testid="add-note" id="add">Add a note</button>
      <p><a href="/about.html">About</a></p>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
